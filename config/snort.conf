# Snort IDS Configuration

# Network variables. The lab compose network is 172.48.0.0/24.
ipvar HOME_NET [10.0.0.0/8,172.48.0.0/24]
ipvar EXTERNAL_NET !$HOME_NET
ipvar DNS_SERVERS $HOME_NET
ipvar SMTP_SERVERS $HOME_NET
ipvar HTTP_SERVERS $HOME_NET

var RULE_PATH /etc/snort/rules
var SO_RULE_PATH /etc/snort/so_rules
var PREPROC_RULE_PATH /etc/snort/preproc_rules
var WHITE_LIST_PATH /etc/snort/rules
var BLACK_LIST_PATH /etc/snort/rules

portvar HTTP_PORTS [80,443,8080,8443]
portvar SHELLCODE_PORTS !80
portvar SSH_PORTS 22

config logdir: /var/log/snort
config pcre_match_limit: 3500
config pcre_match_limit_recursion: 1500
config detection: search-method ac-bnfa

# Dynamic modules installed by the source build.
dynamicpreprocessor directory /usr/local/lib/snort_dynamicpreprocessor/
dynamicengine /usr/local/lib/snort_dynamicengine/libsf_engine.so
dynamicdetection directory /usr/local/lib/snort_dynamicrules

# IP defragmentation and TCP/UDP/ICMP session tracking.
preprocessor frag3_global: max_frags 65536
preprocessor frag3_engine: policy windows detect_anomalies overlap_limit 10 min_fragment_length 100 timeout 180
preprocessor stream5_global: track_tcp yes, track_udp yes, track_icmp no, max_tcp 262144, max_udp 131072, max_active_responses 2, min_response_seconds 5
preprocessor stream5_tcp: policy windows, detect_anomalies, overlap_limit 10, small_segments 3 bytes 150, timeout 180
preprocessor stream5_udp: timeout 180
preprocessor stream5_icmp: timeout 30

include classification.config
include reference.config

output alert_fast: alert
output log_tcpdump: snort.log

include $RULE_PATH/local.rules
# Optional: download the community ruleset into $RULE_PATH and uncomment.
# include $RULE_PATH/community.rules
