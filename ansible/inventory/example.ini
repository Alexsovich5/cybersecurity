# Example inventory for real CentOS 7 hosts. Not used by the tests.
#
# The plays install exact package builds (see group_vars/all.yml), so each
# host needs a yum repository that carries them, for example a copy of the
# base image's /opt/pinned-rpms served over HTTP next to the CentOS 7.5
# "os" tree.
#
# On real hosts systemd is available, so services are managed.

[targets]
web01.example.com
db01.example.com

[ids_sensors]
sensor01.example.com

[elk_server]
elk01.example.com

[all:vars]
ansible_user=ansible
ansible_python_interpreter=/usr/bin/python
hardening_manage_services=true
snort_manage_service=true
ossec_manage_service=true
filebeat_manage_service=true
