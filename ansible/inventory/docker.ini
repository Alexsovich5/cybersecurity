# Docker lab inventory: the compose service "target" stands in for every
# server role. Services are not managed because the containers run without
# systemd.

[targets]
target

[ids_sensors]
target

[elk_server]

[all:vars]
ansible_user=ansible
ansible_ssh_private_key_file=/lab/keys/id_rsa
ansible_python_interpreter=/usr/bin/python
hardening_manage_services=false
snort_manage_service=false
ossec_manage_service=false
filebeat_manage_service=false
