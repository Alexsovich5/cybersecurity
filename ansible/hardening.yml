---
# Site playbook for the security lab. Plays are selected by tag:
# hardening, ossec, snort, filebeat, elk.

- name: Harden CentOS 7 hosts
  hosts: all
  become: yes
  tags: [hardening]

  tasks:
    # Off by default (hardening_update_all_packages: false): a full update
    # is not reproducible, so it cannot pin versions like the task below.
    # "state: latest" is intentional here, hence the skip_ansible_lint tag.
    - name: Update all packages
      yum:
        name: '*'
        state: latest
      when: hardening_update_all_packages | bool
      tags: [skip_ansible_lint]

    - name: Install baseline security packages at pinned builds
      yum:
        name: "{{ hardening_packages }}"
        state: present
      register: hardening_yum
      until: hardening_yum is succeeded
      retries: 3
      delay: 5

    - name: Run Linux hardening script
      script: >-
        {{ playbook_dir }}/../scripts/harden_linux.sh
        {{ '--skip-services' if not hardening_manage_services | bool else '' }}
      register: result
      changed_when: "'CHANGED:' in result.stdout"

- name: Deploy OSSEC HIDS in local mode
  hosts: all
  become: yes
  gather_facts: no
  tags: [ossec]

  tasks:
    - name: Create the deployment directories
      file:
        path: "/opt/cybersec/{{ item }}"
        state: directory
        owner: root
        group: root
        mode: 0755
      with_items:
        - scripts
        - config

    - name: Copy the OSSEC configuration sources
      copy:
        src: "{{ playbook_dir }}/../config/{{ item }}"
        dest: "/opt/cybersec/config/{{ item }}"
        owner: root
        group: root
        mode: 0644
      with_items:
        - ossec.conf
        - ossec_local_rules.xml

    - name: Copy the OSSEC install script
      copy:
        src: "{{ playbook_dir }}/../scripts/deploy_ossec.sh"
        dest: /opt/cybersec/scripts/deploy_ossec.sh
        owner: root
        group: root
        mode: 0755

    # deploy_ossec.sh records the version in /etc/ossec-init.conf only after
    # a successful install, so the build runs once per host.
    - name: Build and install OSSEC in local mode
      command: /opt/cybersec/scripts/deploy_ossec.sh --config-dir /opt/cybersec/config
      args:
        creates: /var/ossec/bin/ossec-control

    # The install script only runs once, so later configuration changes
    # are shipped here and trigger a restart.
    - name: Install ossec.conf and local rules
      copy:
        src: "/opt/cybersec/config/{{ item.src }}"
        dest: "/var/ossec/{{ item.dest }}"
        remote_src: yes
        owner: root
        group: ossec
        mode: 0440
      with_items:
        - {src: ossec.conf, dest: etc/ossec.conf}
        - {src: ossec_local_rules.xml, dest: rules/local_rules.xml}
      notify: Restart ossec

    - name: Start OSSEC
      command: /var/ossec/bin/ossec-control start
      register: ossec_start
      changed_when: "'Started' in ossec_start.stdout"
      when: ossec_manage_service | bool

  handlers:
    - name: Restart ossec
      command: /var/ossec/bin/ossec-control restart
      when: ossec_manage_service | bool

- name: Deploy Snort IDS on network sensors
  hosts: ids_sensors
  become: yes
  gather_facts: no
  tags: [snort]

  tasks:
    - name: Create the deployment directory
      file:
        path: /opt/cybersec/scripts
        state: directory
        owner: root
        group: root
        mode: 0755

    - name: Copy Snort configuration sources
      copy:
        src: "{{ playbook_dir }}/../config"
        dest: /opt/cybersec/
        owner: root
        group: root
        mode: 0644
        directory_mode: 0755

    - name: Copy the Snort install script
      copy:
        src: "{{ playbook_dir }}/../scripts/setup_snort.sh"
        dest: /opt/cybersec/scripts/setup_snort.sh
        owner: root
        group: root
        mode: 0755

    # setup_snort.sh writes the marker only after a verified build, so the
    # build runs once per Snort version.
    - name: Build and install DAQ and Snort
      command: /opt/cybersec/scripts/setup_snort.sh --config-dir /opt/cybersec/config
      args:
        creates: "/etc/snort/.installed-{{ snort_version }}"

    # The install script only runs once, so later configuration changes
    # are shipped here and trigger a restart.
    - name: Install snort.conf and local rules
      copy:
        src: "/opt/cybersec/config/{{ item.src }}"
        dest: "/etc/snort/{{ item.dest }}"
        remote_src: yes
        owner: root
        group: root
        mode: 0644
      with_items:
        - {src: snort.conf, dest: snort.conf}
        - {src: rules/local.rules, dest: rules/local.rules}
      notify: Restart snort

    - name: Install the Snort systemd unit
      template:
        src: templates/snort.service.j2
        dest: /etc/systemd/system/snort.service
        owner: root
        group: root
        mode: 0644
      notify: Restart snort

    - name: Enable and start Snort
      systemd:
        name: snort
        enabled: yes
        state: started
        daemon_reload: yes
      when: snort_manage_service | bool

  handlers:
    - name: Restart snort
      systemd:
        name: snort
        state: restarted
        daemon_reload: yes
      when: snort_manage_service | bool

