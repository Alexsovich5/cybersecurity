---
version: "2.4"
name: cybersecurity

networks:
  lab:
    ipam:
      config:
        - subnet: 172.48.0.0/24

volumes:
  lab-keys:
  pcaps:
  snort-logs:
  ossec-logs:
  ossec-input:
  lab-logs:
  es-data:
  filebeat-data:

services:
  tests:
    build:
      context: .
      dockerfile: docker/tests/Dockerfile
    image: cybersecurity:tests
    volumes:
      - .:/src
      - lab-keys:/lab/keys:ro
      - pcaps:/lab/pcaps
      - lab-logs:/lab/logs/system
      - snort-logs:/lab/logs/snort
      - ossec-logs:/lab/logs/ossec
    environment:
      ES_URL: http://elasticsearch:9200
      SNORT_ALERT: /lab/logs/snort/alert
      OSSEC_ALERTS: /lab/logs/ossec/alerts.json
      SECURE_LOG: /lab/logs/system/secure
      AUDIT_LOG: /lab/logs/system/audit/audit.log
      MAILHOG_URL: http://mailhog:8025
      PFSENSE_HOST: logstash
      PFSENSE_PORT: "5140"
    networks:
      - lab

  base:
    build:
      context: .
      dockerfile: docker/base/Dockerfile
    image: cybersecurity:base
    platform: linux/amd64
    volumes:
      - .:/src
    networks:
      - lab

  target:
    build:
      context: .
      dockerfile: docker/target/Dockerfile
    image: cybersecurity:target
    platform: linux/amd64
    hostname: target
    volumes:
      - lab-keys:/lab/keys
    networks:
      - lab

  snort:
    build:
      context: .
      dockerfile: docker/snort/Dockerfile
    image: cybersecurity:snort
    platform: linux/amd64
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - snort-logs:/var/log/snort
      - pcaps:/lab/pcaps:ro
      - ./tests:/src/tests:ro
    networks:
      - lab

  ossec:
    build:
      context: .
      dockerfile: docker/ossec/Dockerfile
    image: cybersecurity:ossec
    platform: linux/amd64
    volumes:
      - ossec-logs:/var/ossec/logs/alerts
      - ossec-input:/var/log/lab
      - ./tests:/src/tests:ro
    networks:
      - lab

  elasticsearch:
    image: elastic/elasticsearch:6.3.2
    platform: linux/amd64
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"]
      interval: 10s
      timeout: 10s
      retries: 30
    networks:
      - lab

  logstash:
    image: elastic/logstash:6.3.2
    platform: linux/amd64
    environment:
      xpack.monitoring.enabled: "false"
      LS_JAVA_OPTS: -Xms512m -Xmx512m
      ES_HOSTS: elasticsearch:9200
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
    expose:
      - "5140/udp"
    volumes:
      - ./elk/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./elk/es-template.json:/usr/share/logstash/templates/security.json:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - lab

  mailhog:
    image: mailhog/mailhog:v1.0.0
    platform: linux/amd64
    ports:
      - "20825:8025"
    networks:
      - lab

  kibana:
    image: elastic/kibana:6.3.2
    platform: linux/amd64
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      XPACK_MONITORING_ENABLED: "false"
    ports:
      - "20856:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - lab

  filebeat:
    image: elastic/filebeat:6.3.2
    platform: linux/amd64
    user: root
    command: ["filebeat", "-e", "-strict.perms=false"]
    environment:
      SNORT_ALERT: /lab/logs/snort/alert
      OSSEC_ALERTS: /lab/logs/ossec/alerts.json
      SECURE_LOG: /lab/logs/system/secure
      AUDIT_LOG: /lab/logs/system/audit/audit.log
      LOGSTASH_HOST: logstash:5044
    volumes:
      - ./elk/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - lab-logs:/lab/logs/system:ro
      - snort-logs:/lab/logs/snort:ro
      - ossec-logs:/lab/logs/ossec:ro
      - filebeat-data:/usr/share/filebeat/data
    depends_on:
      - logstash
    networks:
      - lab
