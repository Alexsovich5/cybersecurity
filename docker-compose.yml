---
version: "2.4"
name: cybersecurity

networks:
  lab:
    ipam:
      config:
        - subnet: 172.48.0.0/24

volumes:
  lab-keys:

services:
  tests:
    build:
      context: .
      dockerfile: docker/tests/Dockerfile
    image: cybersecurity:tests
    volumes:
      - .:/src
      - lab-keys:/lab/keys:ro
    networks:
      - lab

  base:
    build:
      context: .
      dockerfile: docker/base/Dockerfile
    image: cybersecurity:base
    platform: linux/amd64
    volumes:
      - .:/src
    networks:
      - lab

  target:
    build:
      context: .
      dockerfile: docker/target/Dockerfile
    image: cybersecurity:target
    platform: linux/amd64
    hostname: target
    volumes:
      - lab-keys:/lab/keys
    networks:
      - lab
