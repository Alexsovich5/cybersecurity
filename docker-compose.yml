---
version: "2.4"
name: cybersecurity

networks:
  lab:
    ipam:
      config:
        - subnet: 172.48.0.0/24

volumes:
  lab-keys:
  pcaps:
  snort-logs:
  ossec-logs:
  ossec-input:

services:
  tests:
    build:
      context: .
      dockerfile: docker/tests/Dockerfile
    image: cybersecurity:tests
    volumes:
      - .:/src
      - lab-keys:/lab/keys:ro
      - pcaps:/lab/pcaps
    networks:
      - lab

  base:
    build:
      context: .
      dockerfile: docker/base/Dockerfile
    image: cybersecurity:base
    platform: linux/amd64
    volumes:
      - .:/src
    networks:
      - lab

  target:
    build:
      context: .
      dockerfile: docker/target/Dockerfile
    image: cybersecurity:target
    platform: linux/amd64
    hostname: target
    volumes:
      - lab-keys:/lab/keys
    networks:
      - lab

  snort:
    build:
      context: .
      dockerfile: docker/snort/Dockerfile
    image: cybersecurity:snort
    platform: linux/amd64
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - snort-logs:/var/log/snort
      - pcaps:/lab/pcaps:ro
      - ./tests:/src/tests:ro
    networks:
      - lab

  ossec:
    build:
      context: .
      dockerfile: docker/ossec/Dockerfile
    image: cybersecurity:ossec
    platform: linux/amd64
    volumes:
      - ossec-logs:/var/ossec/logs/alerts
      - ossec-input:/var/log/lab
      - ./tests:/src/tests:ro
    networks:
      - lab
