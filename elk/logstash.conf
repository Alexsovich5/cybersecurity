# Logstash security pipeline: Filebeat events in, parsed documents out to
# Elasticsearch, one index per log type and day.

input {
  beats {
    port => 5044
  }
}

filter {
  # Filebeat 6 no longer sets "type"; each Filebeat input sets
  # fields.log_type instead.
  if [fields][log_type] {
    mutate {
      add_field => { "log_type" => "%{[fields][log_type]}" }
    }
  }

  # Beats 6.3 add a "host" object ({"name": ...}) to every event; Filebeat
  # 6.3.2 sends host.name next to beat.hostname. Logstash inputs such
  # as udp set "host" to a plain string, so a single index cannot map both.
  # Keep the name in "hostname" and drop "host" before output.
  if [host][name] {
    mutate {
      copy => { "[host][name]" => "hostname" }
    }
  } else if [beat][hostname] {
    mutate {
      copy => { "[beat][hostname]" => "hostname" }
    }
  }
  mutate {
    remove_field => ["host"]
  }

  if [log_type] == "snort" {
    grok {
      match => {
        "message" => "^%{NOTSPACE:snort_time}\s+\[\*\*\] \[%{INT:gid}:%{INT:sid}:%{INT:rev}\] %{DATA:alert_msg} \[\*\*\] \[Classification: %{DATA:classification}\] \[Priority: %{INT:priority}\] \{%{WORD:proto}\} %{IP:src_ip}(?::%{INT:src_port})? -> %{IP:dst_ip}(?::%{INT:dst_port})?"
      }
    }
    mutate {
      convert => {
        "gid" => "integer"
        "sid" => "integer"
        "rev" => "integer"
        "priority" => "integer"
        "src_port" => "integer"
        "dst_port" => "integer"
      }
      remove_field => ["snort_time"]
    }
  }

  if [log_type] == "ossec" {
    # Filebeat decodes the alert under "json" (json.keys_under_root: false),
    # so the OSSEC keys are nested field references.
    mutate {
      rename => {
        "[json][rule][level]" => "alert_level"
        "[json][rule][sidid]" => "rule_id"
        "[json][rule][comment]" => "alert_description"
        "[json][srcip]" => "src_ip"
        "[json][full_log]" => "message"
      }
    }
    # The alert carries no timestamp; use the syslog prefix of the log line.
    grok {
      match => { "message" => "^(?<ossec_time>%{MONTH} +%{MONTHDAY} %{TIME})" }
      tag_on_failure => ["_ossec_time_fallback"]
    }
    if [ossec_time] {
      date {
        match => ["ossec_time", "MMM dd HH:mm:ss", "MMM  d HH:mm:ss", "MMM d HH:mm:ss"]
        tag_on_failure => ["_ossec_time_fallback"]
      }
    }
    mutate {
      remove_field => ["json", "ossec_time"]
    }
  }

  if [log_type] == "secure" {
    grok {
      match => { "message" => "^%{SYSLOGBASE} %{GREEDYDATA:syslog_message}" }
    }
    # Only sshd password failures carry a source address to extract;
    # other secure-log lines keep just the syslog fields.
    grok {
      match => {
        "syslog_message" => "^Failed password for (?:invalid user )?%{NOTSPACE:ssh_user} from %{IP:src_ip} port %{INT:src_port:int}"
      }
      tag_on_failure => []
    }
    date {
      match => ["timestamp", "MMM dd HH:mm:ss", "MMM  d HH:mm:ss", "MMM d HH:mm:ss"]
    }
    mutate {
      remove_field => ["timestamp"]
    }
  }

  if [log_type] == "audit" {
    # type=<record type> msg=audit(<epoch>.<ms>:<serial>): key=value ...
    grok {
      match => { "message" => "^type=%{NOTSPACE:type} msg=audit\(%{NUMBER:audit_epoch}:%{INT:audit_serial}\): %{GREEDYDATA:audit_body}" }
    }
    # User-space records wrap their fields in msg='...'; unwrap them so kv
    # reads them as top-level pairs.
    mutate {
      gsub => ["audit_body", "msg='([^']*)'", "\1"]
    }
    kv {
      source => "audit_body"
      target => "audit"
    }
    date {
      match => ["audit_epoch", "UNIX"]
    }
    mutate {
      convert => { "audit_serial" => "integer" }
      remove_field => ["audit_body", "audit_epoch"]
    }
  }

  if [src_ip] {
    geoip {
      source => "src_ip"
      target => "geoip"
      tag_on_failure => []
    }
  }
}

output {
  elasticsearch {
    hosts => ["${ES_HOSTS:elasticsearch:9200}"]
    index => "security-%{log_type}-%{+YYYY.MM.dd}"
    template => "/usr/share/logstash/templates/security.json"
    template_name => "security"
    template_overwrite => true
  }
}
