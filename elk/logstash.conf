# Logstash Security Pipeline

input {
  beats {
    port => 5044
    type => "syslog"
  }

  file {
    path => "/var/log/snort/alert"
    type => "snort"
    start_position => "end"
  }

  file {
    path => "/var/ossec/logs/alerts/alerts.json"
    type => "ossec"
    codec => json
    start_position => "end"
  }
}

filter {
  if [type] == "snort" {
    grok {
      match => { "message" => "\[%{INT:gid}:%{INT:sid}:%{INT:rev}\] %{DATA:alert_msg} \[Classification: %{DATA:classification}\] \[Priority: %{INT:priority}\]" }
    }
    mutate {
      convert => { "priority" => "integer" }
    }
  }

  if [type] == "ossec" {
    mutate {
      rename => { "rule.level" => "alert_level" }
      rename => { "rule.description" => "alert_description" }
    }
  }

  geoip {
    source => "src_ip"
    target => "geoip"
  }
}

output {
  elasticsearch {
    hosts => ["localhost:9200"]
    index => "security-%{type}-%{+YYYY.MM.dd}"
  }

  if [type] == "snort" and [priority] <= 2 {
    email {
      to => "security@example.local"
      subject => "High Priority Snort Alert: %{alert_msg}"
      body => "Source: %{src_ip}\nAlert: %{alert_msg}\nClassification: %{classification}"
    }
  }
}
